[package]
name = "auriscope"
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
description = "An audio player and analyser: waveform, spectrogram and realtime spectrum."
repository = "https://github.com/frdcmp/auriscope"
license = "GPL-3.0-or-later"
# Two binaries, so `cargo run` has to be told which one is the app.
default-run = "auriscope"

[lib]
name = "auriscope"
path = "src/lib.rs"

[[bin]]
name = "auriscope"
path = "src/main.rs"

# The same analysis without a window: JSON and annotated PNGs for scripts and
# for machine readers. A separate binary rather than a subcommand of the first
# one, because the window binary has no console attached on Windows and a tool
# whose whole output is on stdout needs one.
[[bin]]
name = "auriscope-cli"
path = "src/cli/main.rs"

[dependencies]
# `links` is what makes a clicked hyperlink actually reach the browser: without
# it egui-winit swallows the open-url request and only logs a warning. It is an
# eframe default, so turning the defaults off takes it away too.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "links", "wgpu", "wayland", "x11", "persistence"] }
egui = "0.36"
symphonia = { version = "0.6", default-features = false, features = [
    "wav", "aiff", "caf", "flac", "alac", "ape", "pcm", "adpcm",
    "mp3", "aac", "vorbis", "ogg", "isomp4", "mkv",
    "id3v2", "opt-simd",
] }
cpal = "0.18"
realfft = "3.5"
rubato = "5.0"
rtrb = "0.4"
ebur128 = "0.1"
colorous = "1.0"
# File dialogs. `gtk` (default) opens a native GTK dialog; `portal` goes
# through the XDG desktop portal instead, for desktops where that is the
# native dialog and for builds that want no GTK dependency.
rfd = { version = "0.17", default-features = false }
# PNG encoding, for the window capture the camera button saves. Pure Rust,
# and only the encoder half of the crate is used.
png = "0.18"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
# The sidecar metadata a capture writes beside its PNG.
serde_json = "1.0"
# Update check (the `update-check` feature): one GET to the GitHub releases
# API at startup, at most once a day. rustls with bundled roots, so it works
# the same on a bare Windows box as on Linux.
ureq = { version = "3.4", optional = true, default-features = false, features = ["rustls"] }
semver = { version = "1.0", optional = true }

[features]
default = ["gtk", "update-check"]
gtk = ["rfd/gtk3"]
portal = ["rfd/xdg-portal", "rfd/pollster"]
# Tell the user when a newer release is on GitHub. For the archives on the
# release page; distribution packages build without it, since their package
# manager already does this.
update-check = ["dep:ureq", "dep:semver"]

# Dependencies at full optimisation even in debug builds. This is what makes
# `cargo run` usable: FFT, decoding and resampling live in dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
