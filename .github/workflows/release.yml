name: Release

# Builds release binaries when a version tag is pushed and attaches them to
# the GitHub release for that tag. The AUR package builds from the same tag;
# these archives are for everyone else.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: auriscope-${{ github.ref_name }}-x86_64-linux.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: auriscope-${{ github.ref_name }}-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs stamps the binary with `git describe`. The default
          # shallow checkout has no tags, which would make a released build
          # describe itself as a development one.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/auriscope
          cp target/${{ matrix.target }}/release/auriscope dist/auriscope/
          cp target/${{ matrix.target }}/release/auriscope-cli dist/auriscope/
          cp LICENSE README.md dist/auriscope/
          cp assets/io.github.frdcmp.Auriscope.desktop assets/io.github.frdcmp.Auriscope.svg \
             assets/io.github.frdcmp.Auriscope.metainfo.xml dist/auriscope/
          cp assets/fonts/OFL.txt dist/auriscope/OFL-fonts.txt
          # The Claude Code skill, assembled rather than copied: in the
          # repository its references are symlinks into docs/, and a symlink
          # in an archive is no use to whoever unpacks it.
          mkdir -p dist/auriscope/skills/auriscope-cli/reference
          cp skills/auriscope-cli/SKILL.md dist/auriscope/skills/auriscope-cli/
          cp docs/CLI.md docs/QC_SPECS.md specs/starter.toml \
            dist/auriscope/skills/auriscope-cli/reference/
          tar -C dist -czf ${{ matrix.archive }} auriscope
          sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/auriscope | Out-Null
          Copy-Item target/${{ matrix.target }}/release/auriscope.exe dist/auriscope/
          Copy-Item target/${{ matrix.target }}/release/auriscope-cli.exe dist/auriscope/
          Copy-Item LICENSE, README.md dist/auriscope/
          Copy-Item assets/fonts/OFL.txt dist/auriscope/OFL-fonts.txt
          # The skill, assembled from its sources: git for Windows does not
          # necessarily check the repository's symlinks out as symlinks.
          New-Item -ItemType Directory -Force dist/auriscope/skills/auriscope-cli/reference | Out-Null
          Copy-Item skills/auriscope-cli/SKILL.md dist/auriscope/skills/auriscope-cli/
          Copy-Item docs/CLI.md, docs/QC_SPECS.md, specs/starter.toml `
            -Destination dist/auriscope/skills/auriscope-cli/reference/
          Compress-Archive -Path dist/auriscope -DestinationPath ${{ matrix.archive }}
          (Get-FileHash ${{ matrix.archive }} -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.archive }}" |
            Out-File -Encoding ascii ${{ matrix.archive }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          generate_release_notes: true
