<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Auriscope</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b35"/>
      <stop offset="1" stop-color="#111116"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fafaff"/>
      <stop offset="0.5" stop-color="#b9b9c8"/>
      <stop offset="1" stop-color="#7e7e8e"/>
    </linearGradient>
    <linearGradient id="magma" gradientUnits="userSpaceOnUse" x1="65" y1="0" x2="191" y2="0">
      <stop offset="0" stop-color="#5b1878"/>
      <stop offset="0.35" stop-color="#b6377a"/>
      <stop offset="0.72" stop-color="#fb8761"/>
      <stop offset="1" stop-color="#fcd9a0"/>
    </linearGradient>
    <clipPath id="lens">
      <circle cx="128" cy="128" r="71"/>
    </clipPath>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="71" fill="#06060a"/>

  <g clip-path="url(#lens)">
    <line x1="50" y1="128" x2="206" y2="128" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
    <g fill="url(#magma)">
      <rect x="65"  y="106" width="18" height="44"  rx="9"/>
      <rect x="92"  y="89"  width="18" height="78"  rx="9"/>
      <rect x="119" y="71"  width="18" height="114" rx="9"/>
      <rect x="146" y="84"  width="18" height="88"  rx="9"/>
      <rect x="173" y="101" width="18" height="54"  rx="9"/>
    </g>
  </g>

  <circle cx="128" cy="128" r="71" fill="none" stroke="url(#ring)" stroke-width="14"/>
</svg>
